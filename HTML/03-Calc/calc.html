<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="utf-8" />
	<style>
		body {
			background-image: linear-gradient(to bottom right, lightskyblue, pink);
			background-attachment: fixed;
		}
	</style>

	<link rel="stylesheet" href="calc.css">
	<title>Калькулятор</title>
</head>
<body>
	<div id="home" style="position:fixed; right:-1px; bottom:-1px;">
		<a href="../index.html"><img src="../img/home.ico" alt="Home" title="На главную страницу" /></a>
	</div>
	<div class="main-window">
		<div class="title-bar">
			<div class="title-bar-left-side">
				<img src="CalcXP.ico" class="app-icon" />
				<div>&#8211 Калькулятор</div>
			</div>
			<div class="title-bar-right-side">
				<button class="control-button">              <div class="control-button-signature" style="margin-left:-4px;">&#x1F5D5;</div></button>
				<button class="control-button" disabled>    <div class="control-button-signature">&#128470;</div></button>
				<button class="control-button close-button"><div class="control-button-signature close-button-signature ">&#10006; </div></button>
			</div>
		</div>
		<!-- ---------------------------------------------------------- -->
		<div class="client-rect">
			<div class="work-area">
				<div class="menu-bar">
					<button class="menu-button">Правка</button>
					<button class="menu-button">Вид</button>
					<button class="menu-button">Справка</button>
				</div>
				<div class="display-container">
					<input type="text" class="display" id="display" readonly />
				</div>
				<!-- ---------------------------------------------------------- -->
				<div class="calc-buttons">
					<div class="square"></div>
					<div class="clear-buttons">
						<button onclick="backspace()">Backspace</button>
						<button onclick="clearCurrent()">CE</button>
						<button onclick="clearAll()">C</button>
					</div>
					<!-- ---------------------------------------------------------- -->
					<button class="memory-button" onclick="memoryClear()">MC</button>
					<button onclick="inputDigit('7')">7</button>
					<button onclick="inputDigit('8')">8</button>
					<button onclick="inputDigit('9')">9</button>
					<button onclick="inputOperator('/')">/</button>
					<button onclick="squareRoot()">sqrt</button>
					<!-- ---------------------------------------------------------- -->
					<button class="memory-button" onclick="memoryRecall()">MR</button>
					<button onclick="inputDigit('4')">4</button>
					<button onclick="inputDigit('5')">5</button>
					<button onclick="inputDigit('6')">6</button>
					<button onclick="inputOperator('*')">*</button>
					<button onclick="percent()">%</button>
					<!-- ---------------------------------------------------------- -->
					<button class="memory-button" onclick="memoryStore()">MS</button>
					<button onclick="inputDigit('1')">1</button>
					<button onclick="inputDigit('2')">2</button>
					<button onclick="inputDigit('3')">3</button>
					<button onclick="inputOperator('-')">-</button>
					<button onclick="inverse()">1/x</button>
					<!-- ---------------------------------------------------------- -->
					<button class="memory-button" onclick="memoryAdd()">M+</button>
					<button onclick="inputDigit('0')">0</button>
					<button onclick="changeSign()">+/-</button>
					<button onclick="inputDigit('.')">.</button>
					<button onclick="inputOperator('+')">+</button>
					<button onclick="inputEquals()">=</button>
				</div>
			</div>
		</div>
	</div>
    <script src="calc.js"></script>
</body>
</html>
